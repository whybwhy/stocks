# 맥 절전/종료와 무관하게 GitHub 서버에서 주기적으로 사이트를 GET 합니다.
# 사용: 이 저장소를 GitHub에 푸시하고 Actions가 켜져 있으면 됩니다.
# 수동 실행: Actions 탭 → "Keep warm (ping site)" → Run workflow

name: Keep warm (ping site)

on:
  # 기본 브랜치(main)에 올라오면 바로 1회 실행 → "no workflow runs yet" 방지·동작 확인용
  push:
    branches: [main]
  schedule:
    # UTC 기준 10분마다 (한국은 KST = UTC+9)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site
        run: |
          URL="https://stocks-ser4.onrender.com/"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$URL")
          echo "GET $URL → HTTP $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
            exit 0
          fi
          exit 1
