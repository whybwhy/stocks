server:
  port: ${PORT:8080}

spring:
  application:
    name: stocks
  # 로컬 실행 시 프로파일 미지정이면 local → application-local.yml 이 적용됨.
  # Render 등 운영 환경에서는 반드시 SPRING_PROFILES_ACTIVE=prod 로 설정할 것. 설정 안 하면 기본값 local 이 적용되어 application-local.yml(로컬용 설정)이 로드됨.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jackson:
    time-zone: Asia/Seoul

  mvc:
    time-zone: Asia/Seoul
    # 매핑되지 않은 URL 요청 시 NoHandlerFoundException 발생 → 404 페이지 출력
    throw-exception-if-no-handler-found: true
  web:
    resources:
      # 기본 /** 정적 매핑 비활성화 → 없는 경로는 NoHandlerFoundException으로 404 페이지 표시
      add-mappings: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-name: Kakao
            # 로컬: KAKAO_REDIRECT_URI 미설정 시 {baseUrl} → http://localhost:8080
            redirect-uri: "${KAKAO_REDIRECT_URI:{baseUrl}/login/oauth2/code/kakao}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - profile_image
              # app.allowed-user-emails 제한 시 카카오 계정 이메일 동의 필요 (앱에 동의 항목 등록)
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# /stock/chartboy 접근 허용 카카오 계정(닉네임). 비어 있으면 모든 인증 사용자 허용. 아래에 추가하면 해당 닉네임만 접근 가능.
# 이메일 화이트리스트: 비어 있으면 비활성. 공개 목표가 URL(/private/{slug}/list·/{slug}·/{slug}/log 등) 외 카카오 로그인 경로는 목록의 이메일만 허용.
# Render 등: APP_ALLOWED_USER_EMAILS= (여러 명은 콤마로 구분)
# 공개 목표가·목록: 검색 없을 때 최근 등록일만 `/{slug}`, 전체는 `/private/{slug}/list`, 돌파 `/{slug}/log`, 메모 원장 `/{slug}/new`.
app:
  price-alert-public-slug: ${APP_PRICE_ALERT_PUBLIC_SLUG:l4w4ibs803}
  # true: 허용 시각 창만 접근 가능 · false: 24시간 항상 접근. ENV: APP_PRICE_ALERT_PUBLIC_TIME_RESTRICTED=false
  price-alert-public-time-restricted: ${APP_PRICE_ALERT_PUBLIC_TIME_RESTRICTED:true}
  # true: 토·일(아래 window-zone 달력) 공개 slug·돌파 로그·chartbody/log 403. 평일만 시간대 옵션 적용. /stocker 제외.
  # ENV: APP_PRICE_ALERT_PUBLIC_CLOSE_ON_WEEKENDS=true
  price-alert-public-close-on-weekends: ${APP_PRICE_ALERT_PUBLIC_CLOSE_ON_WEEKENDS:true}

  # 공개 목록·로그 접근 허용 시각 (아래 time-restricted 가 true 일 때만, 평일).
  price-alert-public-window-zone: ${APP_PRICE_ALERT_PUBLIC_WINDOW_ZONE:Asia/Seoul}
  price-alert-public-window-start-hour: ${APP_PRICE_ALERT_PUBLIC_WINDOW_START_HOUR:8}
  price-alert-public-window-end-hour: ${APP_PRICE_ALERT_PUBLIC_WINDOW_END_HOUR:18}
  allowed-kakao-accounts: ["30_윤보람", "김효진", "bk", "Yun 보라", "한승우"]
  # allowed-kakao-accounts: [ "닉네임1", "닉네임2" ]
  allowed-user-emails: "${APP_ALLOWED_USER_EMAILS:}"

supabase:
  url: ${SUPABASE_URL:}
  anon-key: ${SUPABASE_ANON_KEY:}

# 텔레그램 봇 토큰 (BotFather에서 발급)
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  # 알람을 보낼 텔레그램 채팅 ID 목록 (콤마 구분, 여러 명/그룹에 동시 발송)
  # Render 환경변수: TELEGRAM_CHAT_IDS=8066272092,1234567890
  chat-ids: "${TELEGRAM_CHAT_IDS:8066272092}"

# 한국투자증권 Open API (국내 주식 목표가 알람 시 KIS 현재가 사용)
# KIS Developers 앱 등록 후 APP_KEY, APP_SECRET 발급
kis:
  app-key: ${KIS_APP_KEY:}
  app-secret: ${KIS_APP_SECRET:}
  # 실전: https://openapi.koreainvestment.com:9443
  # 모의: https://openapivts.koreainvestment.com:29443
  base-url: ${KIS_BASE_URL:https://openapi.koreainvestment.com:9443}
  # websocket: 실시간 체결가 (기본값), rest: 폴링
  mode: ${KIS_MODE:rest}
  # REST 모드일 때 폴링 간격(초). 기본 30초. (환경변수: KIS_REST_CHECK_INTERVAL_SECONDS)
  rest-check-interval-seconds: ${KIS_REST_CHECK_INTERVAL_SECONDS:30}
  # KIS REST 호출 레이트 (req/s). 실전 한도 ≈ 20, 모의 ≈ 2. 안전 마진 두고 기본 15.
  # EGW00201 (초당 거래건수 초과) 방지용. (환경변수: KIS_REST_RATE_PER_SECOND)
  rest-rate-per-second: ${KIS_REST_RATE_PER_SECOND:15}
  # 시장 지수 알림 (코스피·코스닥·야간선물)
  market-index:
    # false 로 설정 시 지수 알림 비활성화 (환경변수: KIS_MARKET_INDEX_ENABLED)
    enabled: ${KIS_MARKET_INDEX_ENABLED:true}
    # 전송 간격(초). 기본 120초 = 2분 (환경변수: KIS_MARKET_INDEX_INTERVAL_SECONDS)
    interval-seconds: ${KIS_MARKET_INDEX_INTERVAL_SECONDS:120}

# FRED API (미국 경제지표 발표일 자동 조회)
# https://fred.stlouisfed.org/docs/api/api_key.html 에서 무료 발급
# https://api.stlouisfed.org/fred/series/search?api_key=abcdefghijklmnopqrstuvwxyz123456&search_text=canada
fred:
  api-key: ${FRED_API_KEY:abcdefghijklmnopqrstuvwxyz123456}

# 경제 이벤트 알림 (FOMC/CPI/PPI/고용지표 D-1/당일 텔레그램 알림)
economic-event:
  enabled: ${ECONOMIC_EVENT_ENABLED:true}

# 테마 시세 알림 (평일 2회: 10:00 / 15:20)
# false 로 설정 시 비활성화 (환경변수: THEME_ENABLED)
theme:
  enabled: ${THEME_ENABLED:true}
