<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>목표가 알람 (price_alerts)</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png"/>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
<div class="w-full max-w-[100rem] mx-auto p-4 sm:p-6">
    <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
        <div>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-800"></h1>
        </div>
        
    </div>

    <p th:if="${error != null}" class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800" th:text="${error}"></p>
    <p th:if="${searchRejected}"
       class="mb-4 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900">
        검색어는 한글·영문·숫자와 <code class="bg-amber-100 px-1 rounded">._·-</code> 공백만, 최대 64자까지 입력할 수 있습니다.
    </p>
    
    <!-- 공개: 검색만 -->
    <form th:if="${readOnly}" method="get" th:action="|/${listPathPrefix}|" class="mb-4 flex flex-wrap items-end gap-2">
        <input type="hidden" name="size" th:value="${pageSize}"/>
        <div class="relative">
            <label for="q-readonly" class="block text-xs font-medium text-slate-600 mb-1">종목명·종목코드 전체 일치</label>
            <input id="q-readonly" name="q" type="search" maxlength="64" autocomplete="off"
                   role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="q-readonly-suggest"
                   data-suggest-input
                   th:attr="data-suggest-url=${suggestUrl}"
                   th:value="${searchQuery}"
                   placeholder="예: 서진시스템, 178320"
                   class="rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white w-56 sm:w-72"/>
            <ul id="q-readonly-suggest" role="listbox" hidden
                class="absolute z-20 top-full mt-1 left-0 w-56 sm:w-72 max-h-64 overflow-y-auto rounded-lg border border-slate-300 bg-white shadow-lg text-sm"></ul>
        </div>
        <button type="submit" class="px-4 py-2 rounded-lg bg-slate-700 text-white text-sm hover:bg-slate-600">검색</button>
        <a th:if="${!#strings.isEmpty(searchQuery)}"
           th:href="|/${listPathPrefix}?size=${pageSize}|"
           role="button"
           class="inline-flex items-center justify-center px-4 py-2 rounded-lg border border-slate-300 bg-white text-slate-700 text-sm font-medium hover:bg-slate-50">목록으로</a>
    </form>

    <!-- 목록 필터 (로그인·관리 화면) -->
    <form th:unless="${readOnly}" method="get" th:action="|/${listPathPrefix}|" class="mb-4 flex flex-wrap items-end gap-3">
        <input type="hidden" name="size" th:value="${pageSize}"/>
        <div>
            <label for="source" class="block text-xs font-medium text-slate-600 mb-1">구분</label>
            <select id="source" name="source" data-suggest-source class="rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white">
                <option value="ALL" th:selected="${sourceFilter == 'ALL'}">전체</option>
                <option value="CHARTBOY" th:selected="${sourceFilter == 'CHARTBOY'}">CHARTBOY</option>
                <option value="MY" th:selected="${sourceFilter == 'MY'}">MY</option>
                <option value="MANUAL" th:selected="${sourceFilter == 'MANUAL'}">MANUAL</option>
            </select>
        </div>
        <div class="relative">
            <label for="q" class="block text-xs font-medium text-slate-600 mb-1">종목명·코드 전체 일치</label>
            <input id="q" name="q" type="search" maxlength="64" autocomplete="off"
                   role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="q-suggest"
                   data-suggest-input data-suggest-source-from="#source"
                   th:attr="data-suggest-url=${suggestUrl}"
                   th:value="${searchQuery}"
                   placeholder="한글·영문·숫자 등"
                   class="rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white w-48 sm:w-64"/>
            <ul id="q-suggest" role="listbox" hidden
                class="absolute z-20 top-full mt-1 left-0 w-48 sm:w-64 max-h-64 overflow-y-auto rounded-lg border border-slate-300 bg-white shadow-lg text-sm"></ul>
        </div>
        <button type="submit" class="px-4 py-2 rounded-lg bg-slate-700 text-white text-sm hover:bg-slate-600">적용</button>
    </form>

    <!-- 페이징 (테이블 위) -->
    <div class="mb-3 flex flex-wrap items-center justify-between gap-3 text-sm text-slate-600"
         th:if="${totalPages > 1}">
        <span>페이지 <strong th:text="${currentPage}">1</strong> / <strong th:text="${totalPages}">1</strong></span>
        <div class="flex flex-wrap gap-2 items-center">
            <a th:if="${currentPage > 1}"
               th:href="|/${listPathPrefix}?page=${currentPage - 1}&size=${pageSize}${listQueryExtra}|"
               class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700">이전</a>
            <a th:if="${currentPage < totalPages}"
               th:href="|/${listPathPrefix}?page=${currentPage + 1}&size=${pageSize}${listQueryExtra}|"
               class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700">다음</a>
        </div>
    </div>

    <div class="overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
        <table class="w-max min-w-full divide-y divide-slate-200 text-xs sm:text-sm">
            <thead class="bg-slate-50">
            <tr>
                <th class="px-3 sm:px-4 py-3 text-left font-semibold text-slate-500 uppercase tracking-wider">ID</th>
                <th class="hidden md:table-cell px-3 sm:px-4 py-3 text-left font-semibold text-slate-500 uppercase tracking-wider">시장</th>
                <th class="px-3 sm:px-4 py-3 text-left font-semibold text-slate-500 uppercase tracking-wider">코드</th>
                <th class="px-3 sm:px-4 py-3 text-left font-semibold text-slate-500 uppercase tracking-wider">종목명</th>
                <th class="px-3 sm:px-4 py-3 text-right font-semibold text-slate-500 uppercase tracking-wider">목표가</th>
                <th class="hidden md:table-cell px-3 sm:px-4 py-3 text-center font-semibold text-slate-500 uppercase tracking-wider">조건</th>
                <th class="px-3 sm:px-4 py-3 text-left font-semibold text-slate-500 uppercase tracking-wider whitespace-nowrap">라벨</th>
                <th th:unless="${readOnly}" class="px-3 sm:px-4 py-3 text-center font-semibold text-slate-500 uppercase tracking-wider">활성</th>
                <th th:unless="${readOnly}" class="hidden md:table-cell px-3 sm:px-4 py-3 text-left font-semibold text-slate-500 uppercase tracking-wider">알람</th>
                <th class="hidden md:table-cell px-3 sm:px-4 py-3 text-left font-semibold text-slate-500 uppercase tracking-wider">등록</th>
                <th th:unless="${readOnly}" class="px-3 sm:px-4 py-3 text-center font-semibold text-slate-500 uppercase tracking-wider w-20">수정</th>
                <th class="table-cell md:hidden px-3 sm:px-4 py-3 text-left font-semibold text-slate-500 uppercase tracking-wider whitespace-nowrap">날짜</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="a : ${alerts}" class="hover:bg-slate-50">
                <td class="px-3 sm:px-4 py-2.5 whitespace-nowrap text-slate-600" th:text="${a.id}">1</td>
                <td class="hidden md:table-cell px-3 sm:px-4 py-2.5 whitespace-nowrap">
                    <span class="inline-block px-2 py-0.5 rounded border text-xs font-medium border-slate-300 text-slate-700 bg-slate-50"
                          th:text="${a.market != null ? a.market : 'KR'}">KR</span>
                </td>
                <td class="px-3 sm:px-4 py-2.5 whitespace-nowrap font-mono text-slate-700" th:text="${a.stockCode}">005930</td>
                <td class="px-3 sm:px-4 py-2.5 font-medium text-slate-800" th:text="${a.symbol}">삼성전자</td>
                <td class="px-3 sm:px-4 py-2.5 text-right text-slate-800 whitespace-nowrap font-mono text-xs"
                    th:with="tp=${a.targetPrice != null ? a.targetPrice.setScale(0, T(java.math.RoundingMode).HALF_UP) : null}"
                    th:text="${tp != null ? #numbers.formatDecimal(tp, 1, 'COMMA', 0, 'POINT') : '-'}">0</td>
                <td class="hidden md:table-cell px-3 sm:px-4 py-2.5 text-center">
                    <span th:if="${a.condition == 'ABOVE'}" class="text-emerald-700 font-medium text-xs">≥ ABOVE</span>
                    <span th:if="${a.condition == 'BELOW'}" class="text-rose-700 font-medium text-xs">≤ BELOW</span>
                    <span th:if="${a.condition != 'ABOVE' and a.condition != 'BELOW'}" th:text="${a.condition}" class="text-slate-600 text-xs">-</span>
                </td>
                <td class="px-3 sm:px-4 py-2.5 text-slate-600 whitespace-nowrap align-top"
                    th:text="${a.label}">-</td>
                <td th:unless="${readOnly}" class="px-3 sm:px-4 py-2.5 text-center text-xs" th:text="${a.isActive != null and a.isActive} ? 'O' : 'X'">O</td>
                <td th:unless="${readOnly}" class="hidden md:table-cell px-3 sm:px-4 py-2.5 text-slate-500 text-xs whitespace-nowrap font-mono"
                    th:text="${a.triggeredAt != null && #strings.length(a.triggeredAt) >= 10 ? #strings.substring(a.triggeredAt, 0, 10) : (a.triggeredAt != null && !#strings.isEmpty(#strings.trim(a.triggeredAt)) ? a.triggeredAt : '-')}">-</td>
                <td class="hidden md:table-cell px-3 sm:px-4 py-2.5 text-slate-500 text-xs whitespace-nowrap font-mono"
                    th:text="${a.createdAt != null && #strings.length(a.createdAt) >= 10 ? #strings.substring(a.createdAt, 0, 10) : (a.createdAt != null && !#strings.isEmpty(#strings.trim(a.createdAt)) ? a.createdAt : '-')}">-</td>
                <td th:unless="${readOnly}" class="px-3 sm:px-4 py-2.5 text-center">
                    <a th:href="|/${listPathPrefix}/edit?id=${a.id}|"
                       class="text-xs px-2 py-1 rounded border border-slate-300 text-slate-600 hover:bg-slate-100">수정</a>
                </td>
                <td class="table-cell md:hidden px-3 sm:px-4 py-2.5 text-slate-500 text-xs whitespace-nowrap font-mono"
                    th:with="ca=${a.createdAt != null && #strings.length(a.createdAt) >= 10 ? #strings.substring(a.createdAt, 0, 10) : null}"
                    th:text="${ca != null and #strings.length(ca) == 10} ? ${#strings.substring(ca, 2, 4) + '.' + #strings.substring(ca, 5, 7) + '.' + #strings.substring(ca, 8, 10)} : '-'">-</td>
            </tr>
            <tr th:if="${#lists.isEmpty(alerts)}">
                <td th:colspan="${readOnly ? 9 : 12}" class="px-4 py-8 text-center text-slate-500">데이터가 없거나 Supabase 연동을 확인하세요.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이징 -->
    <div class="mt-4 flex flex-wrap items-center justify-between gap-3 text-sm text-slate-600">
        <span>총 <strong th:text="${totalCount}">0</strong>건 · 페이지 <strong th:text="${currentPage}">1</strong> / <strong th:text="${totalPages}">1</strong></span>
        <div class="flex flex-wrap gap-2 items-center" th:if="${totalPages > 1}">
            <a th:if="${currentPage > 1}"
               th:href="|/${listPathPrefix}?page=${currentPage - 1}&size=${pageSize}${listQueryExtra}|"
               class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700">이전</a>
            <a th:if="${currentPage < totalPages}"
               th:href="|/${listPathPrefix}?page=${currentPage + 1}&size=${pageSize}${listQueryExtra}|"
               class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700">다음</a>
        </div>
    </div>
</div>

<script>
(function () {
    var inputs = document.querySelectorAll('[data-suggest-input]');
    if (!inputs.length) {
        console.warn('[suggest] no autocomplete input on page');
    }
    inputs.forEach(function (input) {
        var listId = input.getAttribute('aria-controls');
        var list = listId ? document.getElementById(listId) : null;
        if (!list) {
            console.warn('[suggest] missing listbox for', input.id);
            return;
        }
        var url = input.getAttribute('data-suggest-url');
        if (!url) {
            console.warn('[suggest] missing data-suggest-url for', input.id);
            return;
        }
        console.debug('[suggest] init', input.id, '→', url);

        var sourceSel = null;
        var sourceFromSel = input.getAttribute('data-suggest-source-from');
        if (sourceFromSel) sourceSel = document.querySelector(sourceFromSel);

        var debounceTimer = null;
        var lastReqId = 0;
        var activeIndex = -1;
        var items = [];

        function close() {
            list.hidden = true;
            list.innerHTML = '';
            input.setAttribute('aria-expanded', 'false');
            activeIndex = -1;
            items = [];
        }

        function highlight(text, q) {
            var safe = text == null ? '' : String(text);
            if (!q) return document.createTextNode(safe);
            var i = safe.toLowerCase().indexOf(q.toLowerCase());
            if (i < 0) return document.createTextNode(safe);
            var span = document.createElement('span');
            span.appendChild(document.createTextNode(safe.substring(0, i)));
            var b = document.createElement('strong');
            b.className = 'text-slate-900';
            b.textContent = safe.substring(i, i + q.length);
            span.appendChild(b);
            span.appendChild(document.createTextNode(safe.substring(i + q.length)));
            return span;
        }

        function render(results, q) {
            list.innerHTML = '';
            items = [];
            if (!results || results.length === 0) { close(); return; }
            results.forEach(function (r, idx) {
                var li = document.createElement('li');
                li.setAttribute('role', 'option');
                li.setAttribute('data-symbol', r.symbol || '');
                li.setAttribute('data-stock-code', r.stockCode || '');
                li.className = 'cursor-pointer px-3 py-2 hover:bg-slate-100 flex items-center justify-between gap-2';

                var left = document.createElement('span');
                left.className = 'text-slate-800';
                left.appendChild(highlight(r.symbol || '-', q));

                var right = document.createElement('span');
                right.className = 'font-mono text-xs text-slate-500';
                right.appendChild(highlight(r.stockCode || '', q));

                li.appendChild(left);
                li.appendChild(right);

                li.addEventListener('mousedown', function (e) {
                    e.preventDefault();
                    pick(idx, false);
                });
                list.appendChild(li);
                items.push(li);
            });
            list.hidden = false;
            input.setAttribute('aria-expanded', 'true');
            activeIndex = -1;
        }

        function pick(idx, autoSubmit) {
            if (idx < 0 || idx >= items.length) return;
            var li = items[idx];
            var sym = li.getAttribute('data-symbol');
            var code = li.getAttribute('data-stock-code');
            input.value = sym && sym.length > 0 ? sym : code;
            close();
            input.focus();
            if (autoSubmit && input.form) {
                if (typeof input.form.requestSubmit === 'function') {
                    input.form.requestSubmit();
                } else {
                    input.form.submit();
                }
            }
        }

        function fetchSuggest(q) {
            var reqId = ++lastReqId;
            var params = new URLSearchParams();
            params.set('q', q);
            if (sourceSel && sourceSel.value && sourceSel.value !== 'ALL') {
                params.set('source', sourceSel.value);
            }
            var fullUrl = url + '?' + params.toString();
            fetch(fullUrl, { headers: { 'Accept': 'application/json' }, credentials: 'same-origin' })
                .then(function (res) {
                    if (!res.ok) {
                        console.warn('[suggest] HTTP', res.status, fullUrl);
                        return [];
                    }
                    return res.json();
                })
                .then(function (data) {
                    if (reqId !== lastReqId) return;
                    console.debug('[suggest] result', q, data);
                    render(data, q);
                })
                .catch(function (err) {
                    if (reqId === lastReqId) close();
                    console.warn('[suggest] error', err);
                });
        }

        input.addEventListener('input', function () {
            var q = input.value.trim();
            if (debounceTimer) clearTimeout(debounceTimer);
            if (q.length < 1) { close(); return; }
            debounceTimer = setTimeout(function () { fetchSuggest(q); }, 180);
        });

        input.addEventListener('keydown', function (e) {
            if (list.hidden || items.length === 0) return;
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                activeIndex = (activeIndex + 1) % items.length;
                updateActive();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                activeIndex = (activeIndex - 1 + items.length) % items.length;
                updateActive();
            } else if (e.key === 'Enter') {
                if (activeIndex >= 0) {
                    e.preventDefault();
                    pick(activeIndex, true);
                }
            } else if (e.key === 'Escape') {
                close();
            }
        });

        function updateActive() {
            items.forEach(function (li, i) {
                if (i === activeIndex) li.classList.add('bg-slate-100');
                else li.classList.remove('bg-slate-100');
            });
            if (activeIndex >= 0) items[activeIndex].scrollIntoView({ block: 'nearest' });
        }

        input.addEventListener('blur', function () { setTimeout(close, 120); });
    });
})();
</script>
</body>
</html>
