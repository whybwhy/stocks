<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>오늘 커뮤니티 요약</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png"/>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
<div class="w-full max-w-[100rem] mx-auto p-4 sm:p-6">
    <div class="mb-4 flex items-center gap-2 sm:gap-3 w-full min-w-0">
        <div class="flex-1 min-w-0 rounded-lg border border-rose-200 bg-rose-50 px-3 sm:px-4 py-2.5 text-sm text-rose-950 inline-flex flex-row flex-wrap items-center gap-x-3 gap-y-1">
            <span class="min-w-0">차트보이 하트 ❤️ 클릭하셨나요?</span>
            <a href="https://fanding.kr/@chartboy1001/posts"
               target="_blank" rel="noopener noreferrer"
               class="inline-flex items-center gap-1.5 text-rose-900 underline hover:text-rose-950 whitespace-nowrap font-medium shrink-0">
                <img th:src="@{/chartboy-logo.webp}" src="/chartboy-logo.webp" alt="" aria-hidden="true"
                     class="w-5 h-5 shrink-0 rounded-sm"/>
                <span>팬딩 포스트 가기</span>
            </a>
            <a href="https://fanding.kr/@chartboy1001/community/"
               target="_blank" rel="noopener noreferrer"
               class="inline-flex items-center gap-1.5 text-rose-900 underline hover:text-rose-950 whitespace-nowrap font-medium shrink-0">
                <img th:src="@{/chartboy-logo.webp}" src="/chartboy-logo.webp" alt="" aria-hidden="true"
                     class="w-5 h-5 shrink-0 rounded-sm"/>
                <span>팬딩 커뮤니티 가기</span>
            </a>
        </div>
        <div class="shrink-0 flex flex-col sm:flex-row sm:flex-wrap sm:items-center gap-2">
            <a th:href="${slugListHref}"
               class="px-3 py-2.5 rounded-lg border border-slate-300 bg-white text-slate-700 text-sm hover:bg-slate-50 whitespace-nowrap text-center">메인 목록</a>
            <a th:href="${triggerLogHref}"
               class="px-3 py-2.5 rounded-lg border border-slate-300 bg-white text-slate-700 text-sm hover:bg-slate-50 whitespace-nowrap text-center">돌파 로그</a>
        </div>
    </div>

    <div class="mb-4 flex flex-wrap items-center gap-2 sm:gap-3">
        <h1 class="text-xl sm:text-2xl font-bold text-slate-800">최신 커뮤니티 요약</h1>
        <span id="liveDateTime" class="text-xs sm:text-sm text-slate-500"></span>
    </div>

    <!--p class="mb-4 text-sm text-slate-600">
        차트보이·효니효니님 <strong class="font-medium text-slate-800">최근에 기록된 날짜</strong>에 올라온 커뮤니티 요약을 표시합니다.
        <span class="block sm:inline mt-1 sm:mt-0 text-slate-500">오늘(서울): <span th:text="${today}"></span></span>
    </p-->

    <section class="mb-8 rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
        <div class="px-4 sm:px-6 py-3 border-b border-slate-100 bg-slate-50 flex flex-wrap items-baseline gap-2">
            <h2 class="text-base font-semibold text-slate-800">차트보이 ✔ 요약</h2>
            <span class="text-xs text-slate-500" th:if="${chartboyBatchDate != null}"
                  th:text="${chartboyBatchDate}">적재일</span>
            <span class="text-xs text-slate-400" th:if="${chartboyBatchDate == null}">데이터 없음</span>
        </div>
        <div class="p-3 sm:p-4">
            <pre class="rounded-lg bg-slate-50 text-slate-800 text-sm sm:text-base leading-relaxed px-4 py-3 overflow-x-auto font-mono whitespace-pre-wrap border border-slate-200"
                 th:text="${chartboyMarkdown}"></pre>
        </div>
    </section>

    <section class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
        <div class="px-4 sm:px-6 py-3 border-b border-slate-100 bg-slate-50 flex flex-wrap items-baseline gap-2">
            <h2 class="text-base font-semibold text-slate-800">효니효니님 멤버쉽 요약 🌈</h2>
            <span class="text-xs text-slate-500" th:if="${hyonyBatchDate != null}"
                  th:text="${hyonyBatchDate}">적재일</span>
            <span class="text-xs text-slate-400" th:if="${hyonyBatchDate == null}">데이터 없음</span>
        </div>
        <div class="p-3 sm:p-4">
            <pre class="rounded-lg bg-slate-50 text-slate-800 text-sm sm:text-base leading-relaxed px-4 py-3 overflow-x-auto font-mono whitespace-pre-wrap border border-slate-200"
                 th:text="${hyonyMarkdown}"></pre>
        </div>
    </section>

    <div th:replace="~{price-alerts/fragments/affiliate-banners :: affiliate-banners}"></div>
</div>
<script>
(function(){
  var el = document.getElementById('liveDateTime');
  if (el) {
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function update() {
      var d = new Date();
      el.textContent = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }
    update();
    setInterval(update, 1000);
  }
})();
</script>
</body>
</html>
