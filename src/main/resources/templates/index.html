<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>주식 매수종목 관리</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}" href="/favicon.png"/>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex flex-col items-center justify-center px-4">
    <main class="text-center max-w-lg w-full">
        <div th:if="${loginError == 'forbidden'}" class="mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-200 text-sm space-y-3">
            <p>이 서비스에 접근할 수 있는 계정이 아닙니다. (허용된 이메일·서비스 권한이 있는 카카오 계정만 이용할 수 있습니다.)</p>
            <p th:if="${loggedInButBlocked}" class="text-red-300/90">
                <a th:href="@{/logout}" class="underline font-medium hover:text-white">로그아웃</a> 후 허용된 계정으로 다시 로그인해 주세요.
            </p>
        </div>
        <div th:if="${loginError == 'rate_limit'}" class="mb-6 p-4 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-200 text-sm">
            <p class="mb-2">10분간 로그인 요청이 20번을 초과하여 10분 뒤 시도해주세요.</p>
            <a href="https://developers.kakao.com/docs/latest/ko/getting-started/quota#rate-limit" target="_blank" rel="noopener noreferrer" class="underline hover:text-amber-100">카카오 쿼터·요청 수 제한 안내</a>
        </div>

        <div class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-8 shadow-xl">
            <div class="flex justify-center mb-4">
                <span class="text-5xl select-none" aria-hidden="true">❤️</span>
            </div>
            <h2 class="text-white text-lg sm:text-xl font-semibold mb-2">차트보이 영상과 커뮤니티에 하트 클릭</h2>
        </div>

        <!--
        관리자 로그인 링크 (필요 시 주석 해제). URL 직접 입력으로도 로그인 가능: /oauth2/authorization/kakao
        <p class="text-slate-500 text-xs mt-8">
            <a th:href="@{/oauth2/authorization/kakao}" href="/oauth2/authorization/kakao"
               class="underline hover:text-slate-300">관리자 로그인</a>
        </p>
        -->
    </main>
</body>
</html>
